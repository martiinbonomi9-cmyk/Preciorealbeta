name: Captura diaria de precios

on:
  schedule:
    # Argentina es UTC-3 todo el año (sin horario de verano)
    - cron: "0 23 * * *"  # 20:00 ARG
    - cron: "0 5 * * *"   # 02:00 ARG
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: python -m pip install -r scraper/requirements.txt

      - name: Correr scraper
        working-directory: scraper
        run: python run.py

      - name: Commitear datos actualizados
        run: |
          git config user.name "preciorealbeta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Captura de precios $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
